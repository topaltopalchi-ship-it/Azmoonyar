name: Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - version-masked
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      AZMOONYAR_KEYSTORE_BASE64: ${{ secrets.AZMOONYAR_KEYSTORE_BASE64 }}
      AZMOONYAR_KEYSTORE_PASSWORD: ${{ secrets.AZMOONYAR_KEYSTORE_PASSWORD }}
      AZMOONYAR_KEY_ALIAS: ${{ secrets.AZMOONYAR_KEY_ALIAS }}
      AZMOONYAR_KEY_PASSWORD: ${{ secrets.AZMOONYAR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing keystore
        if: env.AZMOONYAR_KEYSTORE_BASE64 != '' && env.AZMOONYAR_KEYSTORE_PASSWORD != '' && env.AZMOONYAR_KEY_ALIAS != '' && env.AZMOONYAR_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/azmoonyar-signing"
          KEYSTORE="$RUNNER_TEMP/azmoonyar-signing/release.jks"
          printf '%s' "$AZMOONYAR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$AZMOONYAR_KEYSTORE_PASSWORD" -alias "$AZMOONYAR_KEY_ALIAS" >/dev/null
          echo "AZMOONYAR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Run OMR and app unit tests
        run: gradle testDebugUnitTest
      - name: Compile debug and release variants
        run: gradle assembleDebug assembleRelease
      - name: Upload debug APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: azmoonyar-debug-apk-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed release APK
        if: env.AZMOONYAR_KEYSTORE_BASE64 != '' && env.AZMOONYAR_KEYSTORE_PASSWORD != '' && env.AZMOONYAR_KEY_ALIAS != '' && env.AZMOONYAR_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: azmoonyar-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload unsigned release APK (signing secrets not configured)
        if: env.AZMOONYAR_KEYSTORE_BASE64 == '' || env.AZMOONYAR_KEYSTORE_PASSWORD == '' || env.AZMOONYAR_KEY_ALIAS == '' || env.AZMOONYAR_KEY_PASSWORD == ''
        uses: actions/upload-artifact@v4
        with:
          name: azmoonyar-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
