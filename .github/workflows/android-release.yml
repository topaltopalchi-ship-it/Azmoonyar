name: Android Release APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing key
        shell: bash
        env:
          AZMOONYAR_KEYSTORE_BASE64: ${{ secrets.AZMOONYAR_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          AZMOONYAR_KEYSTORE_PASSWORD: ${{ secrets.AZMOONYAR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          AZMOONYAR_KEY_ALIAS: ${{ secrets.AZMOONYAR_KEY_ALIAS || secrets.KEY_ALIAS }}
          AZMOONYAR_KEY_PASSWORD: ${{ secrets.AZMOONYAR_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${AZMOONYAR_KEYSTORE_BASE64:-}" || { echo "Missing keystore base64 secret"; exit 1; }
          test -n "${AZMOONYAR_KEYSTORE_PASSWORD:-}" || { echo "Missing keystore password secret"; exit 1; }
          test -n "${AZMOONYAR_KEY_ALIAS:-}" || { echo "Missing key alias secret"; exit 1; }
          test -n "${AZMOONYAR_KEY_PASSWORD:-}" || { echo "Missing key password secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/azmoonyar-release.jks"
          printf '%s' "$AZMOONYAR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$AZMOONYAR_KEYSTORE_PASSWORD" -alias "$AZMOONYAR_KEY_ALIAS" >/dev/null
          echo "AZMOONYAR_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "AZMOONYAR_KEYSTORE_PASSWORD=$AZMOONYAR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AZMOONYAR_KEY_ALIAS=$AZMOONYAR_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AZMOONYAR_KEY_PASSWORD=$AZMOONYAR_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/android-cli"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cli.zip"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R "$RUNNER_TEMP/android-cli/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed Release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "Signed Release APK and AAB were created and verified."

      - name: Upload Release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: azmoonyar-release-apk-aab
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
