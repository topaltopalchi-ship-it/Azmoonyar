name: Android signed release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-signed-release.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AZMOONYAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AZMOONYAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZMOONYAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AZMOONYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name/KEYSTORE_BASE64/AZMOONYAR_KEYSTORE_BASE64}"
              case "$name" in
                KEYSTORE_PASSWORD) echo "::error::Configure AZMOONYAR_KEYSTORE_PASSWORD";;
                KEY_ALIAS) echo "::error::Configure AZMOONYAR_KEY_ALIAS";;
                KEY_PASSWORD) echo "::error::Configure AZMOONYAR_KEY_PASSWORD";;
              esac
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/android-cli"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cli.zip"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R "$RUNNER_TEMP/android-cli/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare and validate signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AZMOONYAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AZMOONYAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZMOONYAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/azmoonyar-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "AZMOONYAR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          AZMOONYAR_KEYSTORE_PASSWORD: ${{ secrets.AZMOONYAR_KEYSTORE_PASSWORD }}
          AZMOONYAR_KEY_ALIAS: ${{ secrets.AZMOONYAR_KEY_ALIAS }}
          AZMOONYAR_KEY_PASSWORD: ${{ secrets.AZMOONYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: azmoonyar-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

# Rebuild requested on the restored Altay source baseline.
