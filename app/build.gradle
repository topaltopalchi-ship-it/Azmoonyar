plugins { id 'com.android.application' }

android {
    namespace 'ir.azmoonyar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.azmoonyar.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
}

dependencies {
    // CameraX: continuous live preview and in-memory frame analysis.
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Pure-Java QR decoding; no network or Google Play service is required at scan time.
    implementation 'com.google.zxing:core:3.5.3'
}
