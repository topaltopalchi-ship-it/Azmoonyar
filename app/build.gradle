plugins { id 'com.android.application' }

def signingStorePath = System.getenv('AZMOONYAR_KEYSTORE_PATH')
def signingStorePassword = System.getenv('AZMOONYAR_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('AZMOONYAR_KEY_ALIAS')
def signingKeyPassword = System.getenv('AZMOONYAR_KEY_PASSWORD')
def signingReady = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'ir.azmoonyar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.azmoonyar.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }

    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    // CameraX: continuous live preview and in-memory frame analysis.
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Offline Persian speech recognition with Vosk; model files are downloaded once to app storage.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
